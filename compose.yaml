# ガントチャート・案件管理・基盤技術  —  Docker Compose 設定
# 設定値は .env で変更する（.env.example を参照）。未設定のときは括弧内の既定値。
services:
  gantt:
    build: .
    image: gantt-pm
    ports:
      - "${PORT:-5005}:5005"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}   # ログインパスワード（.env で設定。未設定なら起動時に仮のパスワードをログに表示）
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-1}   # 新規インストール時にサンプルを入れるか（本番は 0）
      COOKIE_SECURE: ${COOKIE_SECURE:-0}         # https で公開するときは 1
    # コンテナ内の実行ユーザー。データフォルダ（DATA_PATH）の所有者と合わせる
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      # データ（SQLite DB とサーバー上のバックアップ）の保存先。
      # 既定は Docker ボリューム gantt-data。Linux サーバーでは .env で DATA_PATH=./data（ホストのフォルダ）を推奨
      - ${DATA_PATH:-gantt-data}:/data
    restart: unless-stopped

volumes:
  gantt-data:
