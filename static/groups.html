<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJ管理</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/groups.css">
  <link rel="stylesheet" href="/static/inlinepanel.css">
</head>
<body>
  <header class="toolbar">
    <nav class="nav">
      <a href="/">ガントチャート</a>
      <a href="/cases">案件管理</a>
      <a href="/platforms">基盤技術</a>
      <a href="/groups" class="active">グループ</a>
      <a href="/people">個人</a>
      <a href="/records">メモ・議論</a>
      <a href="/services">サービス</a>
      <a href="/documents">共有資料</a>
      <a href="/links">参考リンク</a>
      <a href="/admin">管理</a>
      <a href="/backup">バックアップ</a>
    </nav>
    <div class="tools"></div>
    <a href="/logout" class="logout" title="ログアウト">ログアウト</a>
  </header>

  <div class="gp-layout">
    <!-- 左: グループの一覧 -->
    <aside class="gp-list">
      <div class="gp-list-head">
        <b>グループ一覧</b>
        <button id="btn-group-add" class="primary">＋ グループ追加</button>
      </div>
      <div class="year-bar">
        <label for="year-select">年度</label>
        <select id="year-select" title="表示する年度（4 月始まり）"></select>
        <button type="button" id="btn-years" title="年度の追加・削除">年度の登録</button>
      </div>
      <ul id="gp-items"></ul>
    </aside>

    <!-- 右: 選んだグループの詳細 -->
    <main class="gp-detail" id="detail">
      <p class="hint gp-empty">左の一覧からグループを選択してください。</p>
    </main>
  </div>

  <aside id="goal-panel" class="goal-panel" hidden aria-label="項目の詳細">
    <div id="goal-panel-resize" class="gpn-resize" title="ドラッグで幅を変更（ダブルクリックで元の幅）"></div>
    <div id="goal-panel-body"></div>
  </aside>

  <div id="toast" class="toast" role="status"></div>

  <!-- グループの追加・編集 -->
  <dialog id="dlg-group">
    <form id="form-group" method="dialog" autocomplete="off">
      <h2 id="group-title">グループ追加</h2>
      <label><span>グループ名 <span class="req">*</span></span><input name="name" required placeholder="例: オミクス解析グループ"></label>
      <div class="two">
        <label><span>リーダー</span><input name="pl" placeholder="例: 田中"></label>
        <label><span>メンバー（複数はスペース区切り）</span><input name="members" placeholder="例: 佐藤 鈴木"></label>
      </div>
      <label><span>大目標</span><textarea name="vision" rows="3" placeholder="このグループで中長期的に目指すこと（Markdown で書けます。例: **強調**、- 箇条書き、# 見出し）"></textarea></label>
      <div class="field">
        <span class="field-label">関連サービス（複数選択可）</span>
        <div id="group-services" class="chips-select"></div>
      </div>
      <div class="field">
        <span class="field-label">関連基盤技術（複数選択可）</span>
        <div id="group-platforms" class="chips-select"></div>
      </div>
      <p class="error" id="group-error"></p>
      <div class="actions gp-actions">
        <button type="button" id="group-delete" class="danger-outline">削除…</button>
        <span class="spacer"></span>
        <button type="button" data-close>キャンセル</button>
        <button type="submit" class="primary" id="group-submit">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 年度の登録 -->
  <dialog id="dlg-years">
    <form id="form-year" method="dialog" autocomplete="off">
      <h2>年度の登録</h2>
      <p class="hint">年度は 4 月始まり（例: 2026年度 = 2026/4〜2027/3）。登録した年度が表示の切り替えと入力画面の選択肢に出ます。</p>
      <div class="year-add">
        <input type="number" name="year" min="2000" max="2100" step="1" required placeholder="例: 2027">
        <span>年度</span>
        <button type="submit" class="primary">＋ 登録</button>
      </div>
      <p class="error" id="year-error"></p>
      <ul id="year-list" class="year-list"></ul>
      <div class="actions">
        <button type="button" data-close>閉じる</button>
      </div>
    </form>
  </dialog>

  <!-- 削除（パスワードで確認） -->
  <dialog id="dlg-delete">
    <form id="form-delete" method="dialog">
      <h2 class="danger" id="delete-title">削除</h2>
      <p><span id="delete-lead"></span><strong>この操作は元に戻せません。</strong></p>
      <p id="delete-target" class="summary"></p>
      <label><span>確認のため、パスワードを入力してください</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="delete-error"></p>
      <div class="actions">
        <button type="button" data-close>キャンセル</button>
        <button type="submit" class="danger-btn">削除する</button>
      </div>
    </form>
  </dialog>

  <script src="/static/markdown.js"></script>
  <script src="/static/dragsort.js"></script>
  <script src="/static/inlinepanel.js"></script>
  <script src="/static/groups.js"></script>
</body>
</html>
