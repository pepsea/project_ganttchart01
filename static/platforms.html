<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJ管理</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/platforms.css">
</head>
<body>
  <header class="toolbar">
    <nav class="nav">
      <a href="/">ガントチャート</a>
      <a href="/cases">案件管理</a>
      <a href="/platforms" class="active">基盤技術</a>
      <a href="/groups">グループ</a>
      <a href="/people">個人</a>
      <a href="/services">サービス</a>
      <a href="/documents">共有資料</a>
      <a href="/links">参考リンク</a>
      <a href="/admin">管理</a>
      <a href="/backup">バックアップ</a>
    </nav>
    <a href="/logout" class="logout" title="ログアウト">ログアウト</a>
  </header>

  <div class="pf-layout">
    <!-- 基盤一覧（表）。行をクリックすると詳細を表示 -->
    <main class="pf-listview" id="list-view">
      <div class="pf-list-head">
        <h2>基盤一覧 <span id="pf-count" class="hint"></span></h2>
        <label class="filter">領域 <select id="f-area"><option value="">すべて</option></select></label>
        <label class="filter">メンバー <select id="f-person"><option value="">すべて</option></select></label>
        <span class="spacer"></span>
        <a href="/admin" class="hint" target="_blank" rel="noopener">基盤番号の登録は管理サイト ↗</a>
      </div>
      <div id="pf-table" class="pf-table-wrap"></div>
    </main>

    <!-- 選択した基盤の詳細 -->
    <section class="pf-detail-view" id="detail-view" hidden>
      <div class="pf-backbar">
        <button type="button" id="btn-back">← 基盤一覧</button>
        <span id="back-name" class="hint"></span>
        <span class="spacer"></span>
        <button type="button" id="btn-copy-link" title="この基盤を直接開くリンクをコピー（Teams・メールなどに貼れる）">🔗 リンクをコピー</button>
      </div>
      <main class="pf-detail" id="detail"></main>
    </section>
  </div>

  <aside id="goal-panel" class="goal-panel" hidden aria-label="項目の詳細"></aside>

  <div id="toast" class="toast" role="status"></div>

  <!-- 項目の中の実施内容の追加・編集 -->
  <dialog id="dlg-gtask">
    <form id="form-gtask" method="dialog" autocomplete="off">
      <h2 id="gt-title">実施内容の追加</h2>
      <p id="gt-meta" class="hint"></p>
      <label><span>実施内容 <span class="req">*</span></span><input name="title" required placeholder="例: 解析パイプラインの検証"></label>
      <label><span>進捗率 <b id="gt-pc">0%</b></span><input type="range" name="progress" min="0" max="100" step="5" value="0"></label>
      <div class="goal-form-grid">
        <label><span>担当者（複数はスペース区切り）</span><input name="owner" placeholder="例: 高橋 鈴木"></label>
        <label><span>期限</span><input type="date" name="due_date"></label>
      </div>
      <label><span>メモ</span><textarea name="note" rows="3"></textarea></label>
      <p class="error" id="gt-error"></p>
      <div class="actions goal-actions">
        <button type="button" id="gt-delete" class="danger-outline">削除…</button>
        <span class="spacer"></span>
        <button type="button" data-close>キャンセル</button>
        <button type="submit" class="primary" id="gt-submit">追加</button>
      </div>
    </form>
  </dialog>


  <!-- 目標の追加・編集（目標をクリックで開く） -->
  <dialog id="dlg-goal">
    <form id="form-goal" method="dialog">
      <h2 id="goal-title">項目の編集</h2>
      <p id="goal-meta" class="hint"></p>
      <div class="goal-form-grid">
        <label><span>状態</span><select name="status"></select></label>
        <label><span>期限</span><input type="date" name="due_date"></label>
      </div>
      <label><span>項目 <span class="req">*</span></span><input name="title" required placeholder="例: プロテオーム解析の自動化"></label>
      <label><span>メモ</span><textarea name="note" rows="4" placeholder="補足、達成条件、関連情報など"></textarea></label>
      <label><span>リンク</span><input name="url" type="url" placeholder="https://（資料・報告書など）"></label>
      <p class="error" id="goal-error"></p>
      <div class="actions goal-actions">
        <button type="button" id="goal-delete" class="danger-outline">削除…</button>
        <span class="spacer"></span>
        <button type="button" data-close>キャンセル</button>
        <button type="submit" class="primary" id="goal-submit">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 目標・月報の削除（パスワードで確認） -->
  <dialog id="dlg-goal-delete">
    <form id="form-goal-delete" method="dialog">
      <h2 class="danger" id="goal-delete-title">項目の削除</h2>
      <p><span id="goal-delete-lead">次の目標を削除します。</span><strong>この操作は元に戻せません。</strong></p>
      <p id="goal-delete-name" class="summary"></p>
      <label><span>確認のため、パスワードを入力してください</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="goal-delete-error"></p>
      <div class="actions">
        <button type="button" data-close>キャンセル</button>
        <button type="submit" class="danger-btn">削除する</button>
      </div>
    </form>
  </dialog>
  <script src="/static/dragsort.js"></script>
  <script src="/static/platforms.js"></script>
</body>
</html>
