<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参考リンク</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/links.css">
</head>
<body>
  <header class="toolbar">
    <nav class="nav">
      <a href="/">ガントチャート</a>
      <a href="/cases">案件管理</a>
      <a href="/platforms">基盤技術</a>
      <a href="/services">サービス</a>
      <a href="/documents">共有資料</a>
      <a href="/links" class="active">参考リンク</a>
      <a href="/admin">管理</a>
    </nav>
    <div class="tools">
      <input id="q" type="search" class="search" placeholder="名前・説明・URL・領域で検索">
      <label class="filter">領域 <select id="f-area"><option value="">すべて</option></select></label>
    </div>
    <a href="/logout" class="logout" title="ログアウト">ログアウト</a>
  </header>

  <main class="links-main">
    <!-- 左: 自社技術リンク -->
    <section class="link-section tech">
      <div class="sec-head">
        <h2>自社技術リンク</h2>
        <button class="primary" data-add="tech">＋ 追加</button>
      </div>
      <ul id="list-tech" class="link-list"></ul>
    </section>

    <!-- 右: WEB リンク（自社サービス・その他参考を縦に） -->
    <div class="web-links">
      <h2 class="col-title">WEB リンク</h2>
      <section class="link-section own">
        <div class="sec-head">
          <h2>自社サービス</h2>
          <button class="primary" data-add="own">＋ 追加</button>
        </div>
        <ul id="list-own" class="link-list"></ul>
      </section>
      <section class="link-section other">
        <div class="sec-head">
          <h2>その他参考</h2>
          <button class="primary" data-add="other">＋ 追加</button>
        </div>
        <ul id="list-other" class="link-list"></ul>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <!-- リンクの追加・編集 -->
  <dialog id="dlg-link">
    <form id="form-link" method="dialog" autocomplete="off">
      <h2 id="link-title">リンクを追加</h2>
      <label><span>欄</span>
        <select name="category">
          <option value="tech">自社技術リンク（左）</option>
          <option value="own">WEB リンク：自社サービス（右上）</option>
          <option value="other">WEB リンク：その他参考（右下）</option>
        </select>
      </label>
      <label><span>名前 <span class="req">*</span></span><input name="title" required placeholder="例: 受託解析サービス 公式サイト"></label>
      <label><span>URL <span class="req">*</span></span><input name="url" type="url" required placeholder="https://"></label>
      <label><span>説明</span><textarea name="note" rows="3" placeholder="どんなページか、使いどころなど"></textarea></label>
      <div class="field">
        <span class="field-label">領域（複数選択可）</span>
        <div id="link-areas" class="chips-select"></div>
      </div>
      <p class="error" id="link-error"></p>
      <div class="actions link-actions">
        <button type="button" id="link-delete" class="danger-outline">削除…</button>
        <span class="spacer"></span>
        <button type="button" data-close>キャンセル</button>
        <button type="submit" class="primary" id="link-submit">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 削除（パスワードで確認） -->
  <dialog id="dlg-link-delete">
    <form id="form-link-delete" method="dialog">
      <h2 class="danger">リンクの削除</h2>
      <p>次のリンクを削除します。<strong>この操作は元に戻せません。</strong></p>
      <p id="link-delete-target" class="summary"></p>
      <label><span>確認のため、パスワードを入力してください</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="link-delete-error"></p>
      <div class="actions">
        <button type="button" data-close>キャンセル</button>
        <button type="submit" class="danger-btn">削除する</button>
      </div>
    </form>
  </dialog>

  <script src="/static/links.js"></script>
</body>
</html>
