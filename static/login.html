<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { align-items: center; justify-content: center; padding: 16px; }
    .login-card {
      width: min(360px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px 26px 24px;
      box-shadow: 0 8px 30px rgba(20, 24, 33, .08);
    }
    .login-card h1 { margin: 0 0 4px; font-size: 18px; }
    .login-card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 12.5px; }
    .login-card label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
    .login-card input {
      padding: 9px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      font-size: 14px;
      color: var(--text);
    }
    .login-card input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .login-card button { width: 100%; margin-top: 16px; padding: 9px; font-size: 14px; }
    .login-card .error { margin-top: 10px; }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="/login">
    <h1>プロジェクト管理</h1>
    <p class="sub">ガントチャート・案件管理を利用するにはログインしてください。</p>
    <label>パスワード
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <input type="hidden" name="next" id="next">
    <p class="error" id="error" hidden>パスワードが正しくありません。</p>
    <button type="submit" class="primary">ログイン</button>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("next").value = params.get("next") || "/";
    document.getElementById("error").hidden = !params.has("error");
  </script>
</body>
</html>
